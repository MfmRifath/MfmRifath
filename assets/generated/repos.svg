<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 344" width="1200" height="344" fill="none" role="img" aria-label="&gt; ls ./repos --showcase">
  <defs>
    <style>
      @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
      @keyframes sweep { from { transform:translateX(-260px); } to { transform:translateX(1240px); } }
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.15; } }
      .rise { opacity:0; animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards; }
      .sweep { animation: sweep 5s linear infinite; }
      .blink { animation: blink 1.5s steps(1,end) infinite; }
      
      @media (prefers-reduced-motion: reduce) {
        .rise, .sweep, .blink, .grow, .cell { animation: none; }
        .rise, .cell { opacity:1; transform:none; }
        .grow { transform: scaleX(1); }
      }
    </style>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="swp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#0a1430" opacity=".55"/>
    </pattern>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="344" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect width="1200" height="344" fill="#05060f"/>
    <rect class="blink" x="22" y="21" width="9" height="9" fill="#00f0ff" filter="url(#neon)"/>
    <text x="42" y="30" font-size="13" font-weight="700" letter-spacing="2.5" fill="#00f0ff" filter="url(#neon)">&gt; ls ./repos --showcase</text>
    <rect x="22" y="44" width="1156" height="1.4" fill="url(#cy)" opacity=".55"/>

    <g class="rise" style="animation-delay:0ms">
      <rect x="30" y="68" width="560" height="118" rx="7" fill="#0b1030" stroke="#00f0ff" stroke-opacity=".34"/>
      <text x="50" y="99" font-size="15" font-weight="700" fill="#00f0ff" filter="url(#neon)">S2O-Website</text>
      <text x="50" y="122" font-size="11.5" fill="#8ea0d0">No description.</text>
      <circle cx="55" cy="164" r="5" fill="#00f0ff"/>
      <text x="67" y="168" font-size="11.5" fill="#e6f6ff">TypeScript</text>
      <text x="570" y="168" text-anchor="end" font-size="11.5" fill="#8ea0d0">★ 4   ⎇ 0</text>
    </g>
    <g class="rise" style="animation-delay:90ms">
      <rect x="610" y="68" width="560" height="118" rx="7" fill="#0b1030" stroke="#ff2bd6" stroke-opacity=".34"/>
      <text x="630" y="99" font-size="15" font-weight="700" fill="#ff2bd6" filter="url(#neon)">NOVA-SCIENCE</text>
      <text x="630" y="122" font-size="11.5" fill="#8ea0d0">Online Learning Platform</text>
      <circle cx="635" cy="164" r="5" fill="#ff2bd6"/>
      <text x="647" y="168" font-size="11.5" fill="#e6f6ff">Dart</text>
      <text x="1150" y="168" text-anchor="end" font-size="11.5" fill="#8ea0d0">★ 2   ⎇ 1</text>
    </g>
    <g class="rise" style="animation-delay:180ms">
      <rect x="30" y="204" width="560" height="118" rx="7" fill="#0b1030" stroke="#7c4dff" stroke-opacity=".34"/>
      <text x="50" y="235" font-size="15" font-weight="700" fill="#7c4dff" filter="url(#neon)">LearnWithUsama</text>
      <text x="50" y="258" font-size="11.5" fill="#8ea0d0">Mobile app for Teaching .</text>
      <circle cx="55" cy="300" r="5" fill="#7c4dff"/>
      <text x="67" y="304" font-size="11.5" fill="#e6f6ff">Dart</text>
      <text x="570" y="304" text-anchor="end" font-size="11.5" fill="#8ea0d0">★ 2   ⎇ 0</text>
    </g>
    <g class="rise" style="animation-delay:270ms">
      <rect x="610" y="204" width="560" height="118" rx="7" fill="#0b1030" stroke="#39ff88" stroke-opacity=".34"/>
      <text x="630" y="235" font-size="15" font-weight="700" fill="#39ff88" filter="url(#neon)">Calorie-Tracker-App---Flutter---Dart</text>
      <text x="630" y="258" font-size="11.5" fill="#8ea0d0">No description.</text>
      <circle cx="635" cy="300" r="5" fill="#39ff88"/>
      <text x="647" y="304" font-size="11.5" fill="#e6f6ff">Dart</text>
      <text x="1150" y="304" text-anchor="end" font-size="11.5" fill="#8ea0d0">★ 2   ⎇ 1</text>
    </g>
    <text x="30" y="324" font-size="11" fill="#3f4d78" letter-spacing="1.4">// MOST STARRED · 39 STARS ACROSS 44 REPOS</text>

    <rect width="1200" height="344" fill="url(#scan)" opacity=".45"/>
    <g class="sweep"><rect x="-260" y="0" width="260" height="344" fill="url(#swp)" opacity=".12"/></g>
    <g stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#neon)">
      <path d="M12 34V12h22M1166 12h22v22M1188 310v22h-22M34 332H12v-22"/>
    </g>
    <rect x="1" y="1" width="1198" height="342" rx="10" fill="none" stroke="#16204a" stroke-width="2"/>
  </g>
</svg>
