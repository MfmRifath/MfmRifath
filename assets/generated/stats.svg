<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" fill="none" role="img" aria-label="&gt; gh --stats">
  <defs>
    <style>
      @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
      @keyframes sweep { from { transform:translateX(-260px); } to { transform:translateX(640px); } }
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.15; } }
      .rise { opacity:0; animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards; }
      .sweep { animation: sweep 5s linear infinite; }
      .blink { animation: blink 1.5s steps(1,end) infinite; }
      
      @media (prefers-reduced-motion: reduce) {
        .rise, .sweep, .blink, .grow, .cell { animation: none; }
        .rise, .cell { opacity:1; transform:none; }
        .grow { transform: scaleX(1); }
      }
    </style>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="swp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#0a1430" opacity=".55"/>
    </pattern>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="600" height="260" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect width="600" height="260" fill="#05060f"/>
    <rect class="blink" x="22" y="21" width="9" height="9" fill="#00f0ff" filter="url(#neon)"/>
    <text x="42" y="30" font-size="13" font-weight="700" letter-spacing="2.5" fill="#00f0ff" filter="url(#neon)">&gt; gh --stats</text>
    <rect x="22" y="44" width="556" height="1.4" fill="url(#cy)" opacity=".55"/>

    <g class="rise" style="animation-delay:0ms">
      <rect x="30" y="54" width="172" height="68" rx="6" fill="#0b1030" stroke="#00f0ff" stroke-opacity=".38"/>
      <text x="45" y="83" font-size="27" font-weight="700" fill="#00f0ff" filter="url(#neon)">75</text>
      <text x="45" y="106" font-size="10.5" letter-spacing="2" fill="#8ea0d0">COMMITS</text>
    </g>
    <g class="rise" style="animation-delay:70ms">
      <rect x="217" y="54" width="172" height="68" rx="6" fill="#0b1030" stroke="#ff2bd6" stroke-opacity=".38"/>
      <text x="232" y="83" font-size="27" font-weight="700" fill="#ff2bd6" filter="url(#neon)">31</text>
      <text x="232" y="106" font-size="10.5" letter-spacing="2" fill="#8ea0d0">STARS</text>
    </g>
    <g class="rise" style="animation-delay:140ms">
      <rect x="404" y="54" width="172" height="68" rx="6" fill="#0b1030" stroke="#7c4dff" stroke-opacity=".38"/>
      <text x="419" y="83" font-size="27" font-weight="700" fill="#7c4dff" filter="url(#neon)">43</text>
      <text x="419" y="106" font-size="10.5" letter-spacing="2" fill="#8ea0d0">REPOS</text>
    </g>
    <g class="rise" style="animation-delay:210ms">
      <rect x="30" y="142" width="172" height="68" rx="6" fill="#0b1030" stroke="#39ff88" stroke-opacity=".38"/>
      <text x="45" y="171" font-size="27" font-weight="700" fill="#39ff88" filter="url(#neon)">1</text>
      <text x="45" y="194" font-size="10.5" letter-spacing="2" fill="#8ea0d0">PULL REQS</text>
    </g>
    <g class="rise" style="animation-delay:280ms">
      <rect x="217" y="142" width="172" height="68" rx="6" fill="#0b1030" stroke="#ffd21e" stroke-opacity=".38"/>
      <text x="232" y="171" font-size="27" font-weight="700" fill="#ffd21e" filter="url(#neon)">0</text>
      <text x="232" y="194" font-size="10.5" letter-spacing="2" fill="#8ea0d0">ISSUES</text>
    </g>
    <g class="rise" style="animation-delay:350ms">
      <rect x="404" y="142" width="172" height="68" rx="6" fill="#0b1030" stroke="#00f0ff" stroke-opacity=".38"/>
      <text x="419" y="171" font-size="27" font-weight="700" fill="#00f0ff" filter="url(#neon)">8</text>
      <text x="419" y="194" font-size="10.5" letter-spacing="2" fill="#8ea0d0">FOLLOWERS</text>
    </g>
    <text x="30" y="238" font-size="11" fill="#3f4d78" letter-spacing="1.4">// 83 CONTRIBUTIONS IN THE LAST YEAR</text>
    <text x="570" y="238" text-anchor="end" font-size="11" fill="#3f4d78" letter-spacing="1.4">2026-07-30</text>

    <rect width="600" height="260" fill="url(#scan)" opacity=".45"/>
    <g class="sweep"><rect x="-260" y="0" width="260" height="260" fill="url(#swp)" opacity=".12"/></g>
    <g stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#neon)">
      <path d="M12 34V12h22M566 12h22v22M588 226v22h-22M34 248H12v-22"/>
    </g>
    <rect x="1" y="1" width="598" height="258" rx="10" fill="none" stroke="#16204a" stroke-width="2"/>
  </g>
</svg>
