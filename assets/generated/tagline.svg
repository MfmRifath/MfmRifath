<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 62" width="1200" height="62" fill="none" role="img" aria-label="fine-tuning Llama 3 with QLoRA for Tamil-medium physics / hybrid RAG -- retrieval beats a bigger model / LangGraph agents + Bayesian Knowledge Tracing">
  <defs>
    <style>
      @keyframes show0 { 0%,0.000% { opacity:0; } 0.000%,33.332% { opacity:1; } 33.333%,100% { opacity:0; } }
      @keyframes type0 { 0%,0.000% { transform:translateX(0); } 13.889%,100% { transform:translateX(528.0px); } }
      @keyframes show1 { 0%,33.333% { opacity:0; } 33.333%,66.666% { opacity:1; } 66.667%,100% { opacity:0; } }
      @keyframes type1 { 0%,33.333% { transform:translateX(0); } 47.222%,100% { transform:translateX(422.4px); } }
      @keyframes show2 { 0%,66.667% { opacity:0; } 66.667%,99.999% { opacity:1; } 100.000%,100% { opacity:0; } }
      @keyframes type2 { 0%,66.667% { transform:translateX(0); } 80.556%,100% { transform:translateX(432.0px); } }
      @keyframes cur { 0%,100% { opacity:1; } 50% { opacity:.2; } }
      .cur { animation: cur 1.1s steps(1,end) infinite; }
      @media (prefers-reduced-motion: reduce) {
        [style*='show0'], [style*='type0'], [style*='show1'], [style*='type1'], [style*='show2'], [style*='type2'] { animation: none !important; }
        .cur { animation: none; }
      }
    </style>
    <filter id="tg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="strip"><rect width="1200" height="62" rx="8"/></clipPath>
  </defs>

  <g clip-path="url(#strip)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect width="1200" height="62" fill="#05060f"/>
    <text class="cur" x="22" y="38" font-size="16" font-weight="700" fill="#00f0ff" filter="url(#tg)">&gt;</text>

    <g style="animation:show0 10.8s steps(1,end) infinite">
      <text x="56" y="38" font-size="16" fill="#e6f6ff">fine-tuning Llama 3 with QLoRA for Tamil-medium physics</text>
      <g style="animation:type0 10.8s linear infinite" transform="translate(56 0)">
        <rect x="-10" y="24" width="9" height="18" fill="#00f0ff" filter="url(#tg)"/>
        <rect x="0" y="0" width="1200" height="62" fill="#05060f"/>
      </g>
    </g>
    <g style="animation:show1 10.8s steps(1,end) infinite">
      <text x="56" y="38" font-size="16" fill="#e6f6ff">hybrid RAG -- retrieval beats a bigger model</text>
      <g style="animation:type1 10.8s linear infinite" transform="translate(56 0)">
        <rect x="-10" y="24" width="9" height="18" fill="#00f0ff" filter="url(#tg)"/>
        <rect x="0" y="0" width="1200" height="62" fill="#05060f"/>
      </g>
    </g>
    <g style="animation:show2 10.8s steps(1,end) infinite">
      <text x="56" y="38" font-size="16" fill="#e6f6ff">LangGraph agents + Bayesian Knowledge Tracing</text>
      <g style="animation:type2 10.8s linear infinite" transform="translate(56 0)">
        <rect x="-10" y="24" width="9" height="18" fill="#00f0ff" filter="url(#tg)"/>
        <rect x="0" y="0" width="1200" height="62" fill="#05060f"/>
      </g>
    </g>

    <rect x="1" y="1" width="1198" height="60" rx="8" fill="none" stroke="#16204a" stroke-width="2"/>
  </g>
</svg>
