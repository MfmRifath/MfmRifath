<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" fill="none" role="img" aria-label="&gt; lang --top">
  <defs>
    <style>
      @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
      @keyframes sweep { from { transform:translateX(-260px); } to { transform:translateX(640px); } }
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.15; } }
      .rise { opacity:0; animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards; }
      .sweep { animation: sweep 5s linear infinite; }
      .blink { animation: blink 1.5s steps(1,end) infinite; }
      @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } } .grow { transform:scaleX(0); animation: grow .85s cubic-bezier(.2,.8,.2,1) forwards; }
      @media (prefers-reduced-motion: reduce) {
        .rise, .sweep, .blink, .grow, .cell { animation: none; }
        .rise, .cell { opacity:1; transform:none; }
        .grow { transform: scaleX(1); }
      }
    </style>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="swp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#0a1430" opacity=".55"/>
    </pattern>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="600" height="260" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect width="600" height="260" fill="#05060f"/>
    <rect class="blink" x="22" y="21" width="9" height="9" fill="#00f0ff" filter="url(#neon)"/>
    <text x="42" y="30" font-size="13" font-weight="700" letter-spacing="2.5" fill="#00f0ff" filter="url(#neon)">&gt; lang --top</text>
    <rect x="22" y="44" width="556" height="1.4" fill="url(#cy)" opacity=".55"/>

    <g class="rise" style="animation-delay:0ms">
      <text x="30" y="87" font-size="12.5" fill="#e6f6ff">Python</text>
      <rect x="170" y="77" width="350" height="12" rx="6" fill="#0b1030"/>
      <rect class="grow" x="170" y="77" width="237.6" height="12" rx="6" fill="#00f0ff" filter="url(#neon)" style="transform-origin:170px 0;animation-delay:120ms"/>
      <text x="570" y="87" text-anchor="end" font-size="11.5" fill="#00f0ff">67.9%</text>
    </g>
    <g class="rise" style="animation-delay:80ms">
      <text x="30" y="116" font-size="12.5" fill="#e6f6ff">Jupyter Notebook</text>
      <rect x="170" y="106" width="350" height="12" rx="6" fill="#0b1030"/>
      <rect class="grow" x="170" y="106" width="51.9" height="12" rx="6" fill="#ff2bd6" filter="url(#neon)" style="transform-origin:170px 0;animation-delay:200ms"/>
      <text x="570" y="116" text-anchor="end" font-size="11.5" fill="#ff2bd6">14.8%</text>
    </g>
    <g class="rise" style="animation-delay:160ms">
      <text x="30" y="145" font-size="12.5" fill="#e6f6ff">Dart</text>
      <rect x="170" y="135" width="350" height="12" rx="6" fill="#0b1030"/>
      <rect class="grow" x="170" y="135" width="24.6" height="12" rx="6" fill="#7c4dff" filter="url(#neon)" style="transform-origin:170px 0;animation-delay:280ms"/>
      <text x="570" y="145" text-anchor="end" font-size="11.5" fill="#7c4dff">7.0%</text>
    </g>
    <g class="rise" style="animation-delay:240ms">
      <text x="30" y="174" font-size="12.5" fill="#e6f6ff">Java</text>
      <rect x="170" y="164" width="350" height="12" rx="6" fill="#0b1030"/>
      <rect class="grow" x="170" y="164" width="18.9" height="12" rx="6" fill="#39ff88" filter="url(#neon)" style="transform-origin:170px 0;animation-delay:360ms"/>
      <text x="570" y="174" text-anchor="end" font-size="11.5" fill="#39ff88">5.4%</text>
    </g>
    <g class="rise" style="animation-delay:320ms">
      <text x="30" y="203" font-size="12.5" fill="#e6f6ff">HTML</text>
      <rect x="170" y="193" width="350" height="12" rx="6" fill="#0b1030"/>
      <rect class="grow" x="170" y="193" width="12.4" height="12" rx="6" fill="#ffd21e" filter="url(#neon)" style="transform-origin:170px 0;animation-delay:440ms"/>
      <text x="570" y="203" text-anchor="end" font-size="11.5" fill="#ffd21e">3.5%</text>
    </g>
    <g class="rise" style="animation-delay:400ms">
      <text x="30" y="232" font-size="12.5" fill="#e6f6ff">TypeScript</text>
      <rect x="170" y="222" width="350" height="12" rx="6" fill="#0b1030"/>
      <rect class="grow" x="170" y="222" width="4.5" height="12" rx="6" fill="#ff6633" filter="url(#neon)" style="transform-origin:170px 0;animation-delay:520ms"/>
      <text x="570" y="232" text-anchor="end" font-size="11.5" fill="#ff6633">1.3%</text>
    </g>
    <text x="30" y="238" font-size="11" fill="#3f4d78" letter-spacing="1.4">// BY BYTES ACROSS 43 OWNED REPOS, FORKS EXCLUDED</text>

    <rect width="600" height="260" fill="url(#scan)" opacity=".45"/>
    <g class="sweep"><rect x="-260" y="0" width="260" height="260" fill="url(#swp)" opacity=".12"/></g>
    <g stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#neon)">
      <path d="M12 34V12h22M566 12h22v22M588 226v22h-22M34 248H12v-22"/>
    </g>
    <rect x="1" y="1" width="598" height="258" rx="10" fill="none" stroke="#16204a" stroke-width="2"/>
  </g>
</svg>
