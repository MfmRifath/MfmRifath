        <rect class="fl" width="126" height="56" rx="5" fill="#00f0ff" style="animation-delay:.4s"></rect>
        <text x="63" y="25" text-anchor="middle" font-size="13" fill="#00f0ff" font-weight="700">LangGraph</text>
        <text x="63" y="42" text-anchor="middle" font-size="10" fill="#7fb8d8">router</text>
      </g>

      <g transform="translate(400 100)">
        <rect width="178" height="56" rx="5" fill="#080c22" stroke="#7c4dff" stroke-opacity=".5" stroke-width="1.5"></rect>
