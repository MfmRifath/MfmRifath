        <rect class="hl" width="178" height="56" rx="5" fill="none" stroke="#7c4dff" stroke-width="1.5" filter="url(#qneon)" style="animation-delay:1s"></rect>
        <text x="89" y="25" text-anchor="middle" font-size="13" fill="#e6f6ff" font-weight="700">Solver agent</text>
        <text x="89" y="42" text-anchor="middle" font-size="10" fill="#5f6f9e">step decomposition</text>
