<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" fill="none" role="img" aria-label="AI Tuition Master architecture">
  <defs>
    <style>
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.15; } }
      @keyframes flow  { from { stroke-dashoffset:28; } to { stroke-dashoffset:0; } }
      @keyframes hl    { 0% { opacity:0; } 4% { opacity:1; } 16% { opacity:0; } 100% { opacity:0; } }
      @keyframes fl    { 0% { opacity:0; } 4% { opacity:.25; } 16% { opacity:0; } 100% { opacity:0; } }
      @keyframes sweep { from { transform:translateX(-400px); } to { transform:translateX(1200px); } }
      @keyframes live  { 0%,100% { opacity:.2; } 50% { opacity:1; } }
      @keyframes run   { 0% { offset-distance:0%; opacity:0; } 3% { opacity:1; } 14% { offset-distance:100%; opacity:1; } 15% { opacity:0; } 100% { offset-distance:100%; opacity:0; } }

      .blink { animation: blink 1.5s steps(1,end) infinite; }
      .flow  { stroke-dasharray:6 8; animation: flow 1s linear infinite; }
      .hl    { opacity:0; animation: hl 6s linear infinite; }
      .fl    { opacity:0; animation: fl 6s linear infinite; }
      .sweep { animation: sweep 7s linear infinite; }
      .live  { animation: live 2s ease-in-out infinite; }

      .pk  { offset-rotate:0deg; animation-name: run; animation-duration:6s; animation-timing-function:linear; animation-iteration-count:infinite; }
      .r1  { offset-path: path("M176 218 H222"); }
      .r2  { offset-path: path("M348 218 C376 218 372 128 400 128"); animation-delay:.5s; }
      .r3  { offset-path: path("M348 218 H394"); animation-delay:.5s; }
      .r4  { offset-path: path("M348 218 C376 218 372 308 400 308"); animation-delay:.5s; }
      .r5  { offset-path: path("M578 128 C610 128 600 218 630 218"); animation-delay:1.5s; }
      .r6  { offset-path: path("M578 218 H630"); animation-delay:1.5s; }
      .r7  { offset-path: path("M578 308 C610 308 600 218 630 218"); animation-delay:1.5s; }
      .r8  { offset-path: path("M770 218 H816"); animation-delay:2.7s; }
      .r9  { offset-path: path("M964 218 H1010"); animation-delay:3.3s; }
      .r10 { offset-path: path("M1072 250 V392 H932"); animation-delay:3.9s; }
      .r11 { offset-path: path("M818 416 V438 H80 C62 438 54 428 54 414 V256"); animation-delay:4.7s; }

      @media (prefers-reduced-motion: reduce) {
        .blink,.flow,.hl,.fl,.sweep,.live,.pk { animation: none; }
        .pk { opacity:0; }
      }
    </style>

    <linearGradient id="qsweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"></stop>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity=".14"></stop>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"></stop>
    </linearGradient>
    <pattern id="qscan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#0a1430" opacity=".5"></rect></pattern>
    <filter id="qneon" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <clipPath id="qf"><rect width="1200" height="460" rx="10"></rect></clipPath>
  </defs>

  <g clip-path="url(#qf)">
    <rect width="1200" height="460" fill="#05060f"></rect>
    <g stroke="#0d1533" stroke-width="1">
      <path d="M40 0V460M120 0V460M200 0V460M280 0V460M360 0V460M440 0V460M520 0V460M600 0V460M680 0V460M760 0V460M840 0V460M920 0V460M1000 0V460M1080 0V460M1160 0V460"></path>
