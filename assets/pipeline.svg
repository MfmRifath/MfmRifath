        <text x="67" y="42" text-anchor="middle" font-size="10" fill="#e79ad6">QLoRA fine-tune</text>
      </g>

      <g transform="translate(822 190)">
        <rect width="142" height="56" rx="5" fill="#080c22" stroke="#00f0ff" stroke-opacity=".45" stroke-width="1.5"></rect>
        <rect class="hl" width="142" height="56" rx="5" fill="none" stroke="#00f0ff" stroke-width="1.5" filter="url(#qneon)" style="animation-delay:2.8s"></rect>
        <text x="71" y="25" text-anchor="middle" font-size="13" fill="#e6f6ff" font-weight="700">Groundedness</text>
        <text x="71" y="42" text-anchor="middle" font-size="10" fill="#5f6f9e">+ citation check</text>
