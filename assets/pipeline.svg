        <text x="89" y="25" text-anchor="middle" font-size="13" fill="#e6f6ff" font-weight="700">Retriever</text>
        <text x="89" y="42" text-anchor="middle" font-size="10" fill="#5f6f9e">hybrid BM25 + dense</text>
