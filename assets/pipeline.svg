    <rect class="sweep" x="-400" y="0" width="400" height="460" fill="url(#qsweep)"></rect>
    <rect width="1200" height="460" fill="url(#qscan)" opacity=".45"></rect>
    <g stroke="#00f0ff" stroke-width="2.5" fill="none" filter="url(#qneon)" opacity=".9">
      <path d="M14 40V14h26M1160 14h26v26M1186 420v26h-26M40 446H14v-26"></path>
