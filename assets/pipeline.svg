        <circle class="live" cx="22" cy="28" r="4.5" fill="#39ff88"></circle>
        <text x="72" y="33" text-anchor="middle" font-size="13" fill="#39ff88" font-weight="700">Answer</text>
      </g>

      <g transform="translate(716 366)">
        <rect width="216" height="50" rx="5" fill="#080c22" stroke="#ff2bd6" stroke-opacity=".5" stroke-width="1.5"></rect>
        <rect class="hl" width="216" height="50" rx="5" fill="none" stroke="#ff2bd6" stroke-width="1.5" filter="url(#qneon)" style="animation-delay:4s"></rect>
        <text x="108" y="22" text-anchor="middle" font-size="12" fill="#e6f6ff" font-weight="700">Bayesian Knowledge Tracing</text>
        <text x="108" y="38" text-anchor="middle" font-size="9.5" fill="#5f6f9e">mastery estimate → next question</text>
      </g>

      <text x="1168" y="444" text-anchor="end" font-size="10" fill="#39406b" letter-spacing="2">FEEDBACK LOOP</text>
