      <text x="52" y="36" font-size="13" letter-spacing="4" fill="#00f0ff" font-weight="700" filter="url(#qneon)">AI TUITION MASTER // RUNTIME</text>
      <text x="52" y="58" font-size="11.5" fill="#5f6f9e" letter-spacing=".5">grounded retrieval · fine-tuned generation · adaptive sequencing</text>
    </g>

    <g stroke-width="1.6" fill="none" stroke-linecap="round" filter="url(#qneon)">
      <g class="flow" stroke="#00f0ff" opacity=".8">
        <path d="M176 218 H222"></path>
        <path d="M348 218 C376 218 372 128 400 128"></path>
        <path d="M348 218 H394"></path>
        <path d="M348 218 C376 218 372 308 400 308"></path>
      </g>
      <g class="flow" stroke="#7c4dff" opacity=".85">
        <path d="M578 128 C610 128 600 218 630 218"></path>
        <path d="M578 218 H630"></path>
        <path d="M578 308 C610 308 600 218 630 218"></path>
        <path d="M400 128 H378 C362 128 358 142 358 156 V376 C358 388 366 392 378 392 H394"></path>
        <path d="M489 336 V360"></path>
      </g>
      <g class="flow" stroke="#ff2bd6" opacity=".85">
        <path d="M770 218 H816"></path>
        <path d="M964 218 H1010"></path>
        <path d="M1072 250 V392 H932"></path>
        <path d="M818 416 V438 H80 C62 438 54 428 54 414 V256"></path>
      </g>
    </g>

    <g filter="url(#qneon)">
      <g fill="#00f0ff"><path d="M222 213l11 5-11 5z"></path><path d="M400 123l11 5-11 5z"></path><path d="M394 213l11 5-11 5z"></path><path d="M400 303l11 5-11 5z"></path></g>
      <g fill="#7c4dff"><path d="M630 213l11 5-11 5z"></path><path d="M394 387l11 5-11 5z"></path><path d="M484 360l5 11 5-11z"></path></g>
      <g fill="#ff2bd6"><path d="M816 213l11 5-11 5z"></path><path d="M1010 213l11 5-11 5z"></path><path d="M932 387l-11 5 11 5z"></path><path d="M49 256l5-11 5 11z"></path></g>
    </g>

    <g filter="url(#qneon)">
      <circle class="pk r1" r="4.5" fill="#00f0ff"></circle>
      <circle class="pk r2" r="4.5" fill="#00f0ff"></circle>
      <circle class="pk r3" r="4.5" fill="#00f0ff"></circle>
      <circle class="pk r4" r="4.5" fill="#00f0ff"></circle>
      <circle class="pk r5" r="4.5" fill="#a98bff"></circle>
      <circle class="pk r6" r="4.5" fill="#a98bff"></circle>
      <circle class="pk r7" r="4.5" fill="#a98bff"></circle>
      <circle class="pk r8" r="4.5" fill="#ff2bd6"></circle>
