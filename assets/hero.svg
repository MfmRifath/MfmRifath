<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none" role="img" aria-label="Rifath MFM — AI Engineer">
  <defs>
    <style>
      @keyframes gm      { from { transform: translateY(0); } to { transform: translateY(26px); } }
      @keyframes spin    { to { transform: rotate(360deg); } }
      @keyframes haze    { 0%,100% { opacity:.10; } 50% { opacity:.28; } }
      @keyframes ring    { 0% { transform:scale(1); opacity:.28; } 100% { transform:scale(1.55); opacity:0; } }
      @keyframes blink   { 0%,100% { opacity:1; } 50% { opacity:.15; } }
      @keyframes gA      { 0%,60% { transform:translateX(0); } 64% { transform:translateX(-5px); } 68% { transform:translateX(4px); } 72%,100% { transform:translateX(0); } }
      @keyframes gB      { 0%,60% { transform:translateX(0); } 64% { transform:translateX(5px); } 68% { transform:translateX(-4px); } 72%,100% { transform:translateX(0); } }
      @keyframes gW      { 0%,62% { opacity:1; } 66% { opacity:.45; } 70%,100% { opacity:1; } }
      @keyframes gbar    { 0%,64% { opacity:0; } 66% { opacity:.92; } 69%,100% { opacity:0; } }
      @keyframes rule    { from { transform:scaleX(0); } to { transform:scaleX(1); } }
      @keyframes scanbar { from { transform:translateY(0); } to { transform:translateY(450px); } }
      @keyframes np      { 0%,100% { r:4; } 50% { r:6.5; } }
      @keyframes fwd     { 0% { offset-distance:0%; opacity:0; } 12% { opacity:1; } 88% { opacity:1; } 100% { offset-distance:100%; opacity:0; } }
      @keyframes back    { 0% { offset-distance:100%; opacity:0; } 12% { opacity:1; } 88% { opacity:1; } 100% { offset-distance:0%; opacity:0; } }

      .gm      { animation: gm 2.2s linear infinite; }
      .spin    { transform-origin:0 0; animation: spin 24s linear infinite; }
      .spinr   { transform-origin:0 0; animation: spin 16s linear infinite reverse; }
      .spin30  { transform-origin:0 0; animation: spin 30s linear infinite; }
      .orb6    { transform-origin:0 0; animation: spin 6s linear infinite; }
      .orb9    { transform-origin:0 0; animation: spin 9s linear infinite reverse; }
      .haze    { animation: haze 3s ease-in-out infinite; }
      .ring    { transform-origin:0 0; animation: ring 2.4s ease-out infinite; }
      .blink   { animation: blink 1.5s steps(1,end) infinite; }
      .blink2  { animation: blink 1.8s steps(1,end) infinite; }
      .gA      { animation: gA 4s steps(1,end) infinite; }
      .gB      { animation: gB 4s steps(1,end) infinite; }
      .gW      { animation: gW 4s steps(1,end) infinite; }
      .gBar    { animation: gbar 4s steps(1,end) infinite; }
      .rule    { transform-origin:64px 0; animation: rule 1s cubic-bezier(.2,.8,.2,1) forwards; }
      .scanbar { animation: scanbar 4.5s linear infinite; }
      .np      { animation: np 3s ease-in-out infinite; }

      .pk { offset-rotate:0deg; animation-timing-function:linear; animation-iteration-count:infinite; }
      .k1 { offset-path: path("M0 0 L-150 -92"); animation-name: back; animation-duration:2.6s; }
      .k2 { offset-path: path("M0 0 L-168 34");  animation-name: back; animation-duration:3.1s; animation-delay:-.5s; }
      .k3 { offset-path: path("M0 0 L-96 118");  animation-name: back; animation-duration:2.9s; animation-delay:-1.1s; }
      .k4 { offset-path: path("M0 0 L128 -104"); animation-name: fwd;  animation-duration:2.7s; animation-delay:-.2s; }
      .k5 { offset-path: path("M0 0 L164 22");   animation-name: fwd;  animation-duration:3.3s; animation-delay:-.9s; }
      .k6 { offset-path: path("M0 0 L74 122");   animation-name: fwd;  animation-duration:3s;   animation-delay:-1.6s; }

      @media (prefers-reduced-motion: reduce) {
        .gm,.spin,.spinr,.spin30,.orb6,.orb9,.haze,.ring,.blink,.blink2,
        .gA,.gB,.gW,.gBar,.rule,.scanbar,.np,.pk { animation: none; }
        .rule { transform: scaleX(1); }
      }
    </style>

    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"></stop><stop offset="100%" stop-color="#7c4dff"></stop>
    </linearGradient>
    <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060f" stop-opacity="1"></stop>
      <stop offset="55%" stop-color="#05060f" stop-opacity=".25"></stop>
      <stop offset="100%" stop-color="#05060f" stop-opacity="0"></stop>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="100%">
      <stop offset="0%" stop-color="#ff2bd6" stop-opacity=".5"></stop>
      <stop offset="60%" stop-color="#7c4dff" stop-opacity=".16"></stop>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="scanbarg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"></stop>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity=".45"></stop>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"></stop>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#0a1430" opacity=".55"></rect>
    </pattern>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"></feGaussianBlur></filter>
    <clipPath id="hf"><rect width="1200" height="380" rx="10"></rect></clipPath>
    <clipPath id="floorclip"><rect x="0" y="248" width="1200" height="132"></rect></clipPath>
  </defs>

  <g clip-path="url(#hf)">
    <rect width="1200" height="380" fill="#05060f"></rect>
    <ellipse cx="600" cy="256" rx="520" ry="150" fill="url(#sun)"></ellipse>

    <g clip-path="url(#floorclip)">
      <g stroke="#00f0ff" stroke-width="1" opacity=".5">
        <path d="M600 248 L-260 380M600 248 L-60 380M600 248 L180 380M600 248 L360 380M600 248 L500 380M600 248 L600 380M600 248 L700 380M600 248 L840 380M600 248 L1020 380M600 248 L1260 380M600 248 L1460 380"></path>
      </g>
      <g class="gm" stroke="#ff2bd6" stroke-width="1.1" opacity=".65">
        <path d="M0 252H1200M0 258H1200M0 266H1200M0 277H1200M0 292H1200M0 312H1200M0 338H1200M0 372H1200M0 416H1200"></path>
      </g>
      <rect x="0" y="248" width="1200" height="72" fill="url(#floorfade)"></rect>
      <rect x="0" y="246" width="1200" height="2.5" fill="#00f0ff" filter="url(#neon)"></rect>
    </g>

    <g transform="translate(960 158)">
      <circle r="86" fill="#ff2bd6" class="haze" filter="url(#bigglow)"></circle>
      <path class="spin" d="M0-74 64-37 64 37 0 74-64 37-64-37Z" fill="none" stroke="#00f0ff" stroke-width="1.6" filter="url(#neon)"></path>
      <path class="spinr" d="M0-52 45-26 45 26 0 52-45 26-45-26Z" fill="none" stroke="#ff2bd6" stroke-width="1.2" filter="url(#neon)"></path>
      <circle class="spin30" r="96" fill="none" stroke="#7c4dff" stroke-width="1" stroke-dasharray="3 14" opacity=".8"></circle>

      <g filter="url(#neon)">
        <circle class="pk k1" r="3.6" fill="#00f0ff"></circle>
        <circle class="pk k2" r="3.6" fill="#00f0ff"></circle>
        <circle class="pk k3" r="3.6" fill="#00f0ff"></circle>
        <circle class="pk k4" r="3.6" fill="#ff2bd6"></circle>
        <circle class="pk k5" r="3.6" fill="#ff2bd6"></circle>
        <circle class="pk k6" r="3.6" fill="#ff2bd6"></circle>
      </g>

      <g stroke="#7c4dff" stroke-width="1.2" opacity=".45" fill="none">
        <path d="M0 0 L-150 -92M0 0 L-168 34M0 0 L-96 118M0 0 L128 -104M0 0 L164 22M0 0 L74 122"></path>
      </g>

      <g filter="url(#neon)">
        <circle class="orb6" cx="0" cy="-96" r="3.5" fill="#00f0ff"></circle>
        <circle class="orb6" cx="0" cy="96" r="3.5" fill="#ff2bd6"></circle>
        <circle class="orb9" cx="96" cy="0" r="2.5" fill="#7c4dff"></circle>
      </g>

      <g>
        <g transform="translate(-150 -92)"><circle r="14" fill="#080c22" stroke="#00f0ff" stroke-width="1.4"></circle><circle class="np" r="4" fill="#00f0ff"></circle></g>
        <g transform="translate(-168 34)"><circle r="14" fill="#080c22" stroke="#00f0ff" stroke-width="1.4"></circle><circle class="np" r="4" fill="#00f0ff" style="animation-delay:-.4s"></circle></g>
        <g transform="translate(-96 118)"><circle r="14" fill="#080c22" stroke="#00f0ff" stroke-width="1.4"></circle><circle class="np" r="4" fill="#00f0ff" style="animation-delay:-.8s"></circle></g>
        <g transform="translate(128 -104)"><circle r="14" fill="#080c22" stroke="#ff2bd6" stroke-width="1.4"></circle><circle class="np" r="4" fill="#ff2bd6" style="animation-delay:-1.2s"></circle></g>
        <g transform="translate(164 22)"><circle r="14" fill="#080c22" stroke="#ff2bd6" stroke-width="1.4"></circle><circle class="np" r="4" fill="#ff2bd6" style="animation-delay:-1.6s"></circle></g>
        <g transform="translate(74 122)"><circle r="14" fill="#080c22" stroke="#ff2bd6" stroke-width="1.4"></circle><circle class="np" r="4" fill="#ff2bd6" style="animation-delay:-2s"></circle></g>
      </g>

      <circle class="ring" r="30" fill="#00f0ff"></circle>
      <circle r="30" fill="#05060f" stroke="url(#cy)" stroke-width="2" filter="url(#neon)"></circle>
      <text y="5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#e6f6ff" letter-spacing="1">LLM</text>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <rect class="blink" x="64" y="56" width="10" height="10" fill="#00f0ff" filter="url(#neon)"></rect>
      <text x="88" y="66" font-size="14" letter-spacing="6" fill="#00f0ff" font-weight="700" filter="url(#neon)">AI ENGINEER</text>

      <g font-size="66" font-weight="700" letter-spacing="-1">
        <text class="gA" x="64" y="150" fill="#ff2bd6" opacity=".85" filter="url(#neon)">RIFATH MFM</text>
        <text class="gB" x="64" y="150" fill="#00f0ff" opacity=".85" filter="url(#neon)">RIFATH MFM</text>
        <text class="gW" x="64" y="150" fill="#ffffff">RIFATH MFM</text>
        <rect class="gBar" x="64" y="116" width="470" height="13" fill="#05060f"></rect>
      </g>

      <rect class="rule" x="64" y="168" width="430" height="3" fill="url(#cy)" filter="url(#neon)"></rect>

      <text x="64" y="204" font-size="17" fill="#8ea0d0" letter-spacing=".5">LLM fine-tuning<tspan fill="#ff2bd6"> · </tspan>RAG<tspan fill="#ff2bd6"> · </tspan>Agentic systems</text>

      <g font-size="12.5">
        <rect x="64" y="228" width="184" height="30" rx="4" fill="#0b1030" stroke="#00f0ff" stroke-opacity=".55"></rect>
        <text x="80" y="248" fill="#00f0ff">QLoRA · Llama 3</text>
        <rect x="258" y="228" width="176" height="30" rx="4" fill="#0b1030" stroke="#ff2bd6" stroke-opacity=".55"></rect>
        <text x="274" y="248" fill="#ff2bd6">LangGraph · RAG</text>
        <rect x="444" y="228" width="160" height="30" rx="4" fill="#0b1030" stroke="#7c4dff" stroke-opacity=".6"></rect>
        <text x="460" y="248" fill="#a98bff">FastAPI · Docker</text>
      </g>

      <circle class="blink2" cx="1122" cy="44" r="4.5" fill="#39ff88" filter="url(#neon)"></circle>
      <text x="1108" y="49" text-anchor="end" font-size="12" fill="#8ea0d0" letter-spacing="1.5">OPEN TO AI/ML ROLES</text>

      <text x="64" y="352" font-size="11.5" fill="#3f4d78" letter-spacing="2">// COLOMBO · UTC+5:30 · TAMIL / ENGLISH / SINHALA</text>
    </g>

    <rect width="1200" height="380" fill="url(#scan)" opacity=".5"></rect>
    <rect class="scanbar" x="0" y="-70" width="1200" height="70" fill="url(#scanbarg)" opacity=".4"></rect>

    <g stroke="#00f0ff" stroke-width="2.5" fill="none" filter="url(#neon)">
      <path d="M14 44V14h30M1156 14h30v30M1186 336v30h-30M44 366H14v-30"></path>
    </g>
    <rect x="1" y="1" width="1198" height="378" rx="10" fill="none" stroke="#16204a" stroke-width="2"></rect>
  </g>
</svg>
