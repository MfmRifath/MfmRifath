<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14" fill="none" role="presentation">
  <defs>
    <style>
      @keyframes dv { from { transform: translateX(-430px); } to { transform: translateX(1210px); } }
      .sw { animation: dv 4s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .sw { animation: none; } }
    </style>
    <linearGradient id="dp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"></stop>
      <stop offset="45%" stop-color="#00f0ff" stop-opacity=".5"></stop>
      <stop offset="50%" stop-color="#ff2bd6" stop-opacity="1"></stop>
      <stop offset="55%" stop-color="#00f0ff" stop-opacity=".5"></stop>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"></stop>
    </linearGradient>
    <filter id="dg" x="-20%" y="-400%" width="140%" height="900%"><feGaussianBlur stdDeviation="2.2"></feGaussianBlur></filter>
  </defs>
  <rect y="6" width="1200" height="1.4" fill="#00f0ff" opacity=".26"></rect>
  <g class="sw">
    <rect x="0" y="3" width="420" height="8" fill="url(#dp)" filter="url(#dg)"></rect>
    <rect x="0" y="6" width="420" height="1.6" fill="url(#dp)"></rect>
  </g>
  <g fill="#ff2bd6" opacity=".8"><rect x="0" y="3" width="2" height="8"></rect><rect x="1198" y="3" width="2" height="8"></rect></g>
</svg>
